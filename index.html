<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTI认证平台</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:238px;background:#101a33;color:#cbd5e1;display:flex;flex-direction:column}
.brand{padding:22px 20px;border-bottom:1px solid #26314d}
.brand b{display:block;color:white;font-size:17px}.brand span{font-size:12px;color:#8290aa}
.menu{padding:14px 10px;flex:1}.menu-item{padding:12px 14px;margin:5px 0;border-radius:8px;cursor:pointer}
.menu-item:hover,.menu-item.active{background:#2563eb;color:white}
.user{padding:16px 18px;border-top:1px solid #26314d;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:68px;background:white;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.topbar h2{margin:0;font-size:20px}.top-actions{display:flex;gap:10px}
.btn{border:1px solid #d9e0ea;background:white;border-radius:8px;padding:8px 13px;cursor:pointer}
.btn.primary{background:#2563eb;color:white;border-color:#2563eb}.btn.danger{color:#dc2626}
.content{padding:22px;overflow:auto}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:white;border:1px solid #e6eaf0;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(15,23,42,.03)}
.metric{font-size:29px;font-weight:700;margin:9px 0}.muted{color:#7a869a;font-size:13px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
h3{margin:0 0 14px;font-size:16px}
.progress{height:8px;background:#edf1f6;border-radius:10px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:#2563eb}
.course-row,.analysis-row{padding:13px 0;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:space-between}
.badge{padding:4px 8px;border-radius:12px;font-size:12px;background:#eef4ff;color:#2563eb}
.badge.warn{background:#fff5df;color:#b66a00}.badge.red{background:#fff0f0;color:#d12b2b}.badge.green{background:#eaf8f0;color:#138a4b}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.graph-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.graph{height:570px;background:linear-gradient(#fff,#fbfcff);border:1px solid #e2e7ef;border-radius:12px;position:relative;overflow:hidden}
.graph:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#dbe2ec 1px,transparent 1px);background-size:22px 22px}
.node{position:absolute;transform:translate(-50%,-50%);min-width:112px;padding:11px 13px;text-align:center;background:white;border:2px solid #2563eb;border-radius:10px;box-shadow:0 5px 15px rgba(37,99,235,.12);cursor:pointer;z-index:2;font-size:13px}
.node.root{background:#2563eb;color:white}.node.skill{border-color:#8b5cf6}.node.chapter{border-color:#16a34a}
.line{position:absolute;height:2px;background:#b8c2d3;transform-origin:left center;z-index:1}
.panel label{display:block;font-size:12px;color:#6d7788;margin:12px 0 5px}.panel input,.panel textarea,.panel select{width:100%;padding:9px;border:1px solid #dce2eb;border-radius:7px;background:white}.panel textarea{height:90px;resize:vertical}
.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf0f5;font-size:13px}.table th{background:#f8fafc;color:#596579}
.alert{padding:13px 15px;border-radius:8px;background:#fff7e8;border:1px solid #f5d99f;color:#8b5b00;margin-bottom:12px}
.map{height:580px;position:relative;background:white;border:1px solid #e4e9f0;border-radius:12px;overflow:hidden}
.map-title{position:absolute;left:22px;top:20px;z-index:4}
.legend{position:absolute;right:20px;top:18px;z-index:4;background:white;padding:10px;border:1px solid #e5e9f0;border-radius:8px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}.modal-box{width:460px;background:white;border-radius:14px;padding:22px}.modal-box h3{font-size:18px}
.form-row{margin:12px 0}.form-row input,.form-row select{width:100%;padding:10px;border:1px solid #dce2eb;border-radius:8px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.graph-layout,.grid2{grid-template-columns:1fr}.sidebar{width:190px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand">
  <img class="brand-logo" src="assets/sjtu-paris-logo.png" alt="上海交通大学巴黎卓越工程师学院标准标志">
</div>
 <div class="menu">
  <div class="menu-item active" data-page="dashboard">▦　管理驾驶舱</div>
  <div class="menu-item" data-page="courses">▤　课程管理</div>
  <div class="menu-item" data-page="editor">◉　课程图谱编辑</div>
  <div class="menu-item" data-page="map">⌘　专业知识地图</div>
  <div class="menu-item" data-page="redundancy">◫　冗余分析</div>
  <div class="menu-item" data-page="gap">△　缺口分析</div>
 </div>
 <div class="user"><div class="demo-role-heading">角色切换 <span>演示模式</span></div>
  <label for="demoRole">当前角色</label><select id="demoRole"><option value="admin">学院管理员</option><option value="teacher">任课老师</option><option value="student">学生</option></select>
  <label for="demoTeacher" id="demoTeacherLabel" hidden>选择任课老师</label><select id="demoTeacher" hidden aria-label="选择任课老师"></select>
  <small>仅供演示，不是真实登录或权限控制</small>
 </div>
</aside>

<main class="main">
 <header class="topbar"><h2 id="pageTitle">管理驾驶舱</h2></header>
 <div class="content">

<section id="dashboard" class="page active"><div class="cards"></div><div class="grid2"><div class="card"></div><div class="card"></div></div></section>

<section id="courses" class="page">
 <div class="card"><div class="cti-top"><h3>课程管理</h3><button class="btn primary" id="newCourseButton" type="button" onclick="openModal()">＋ 新建课程</button></div>
 <div class="course-filters">
  <label>专业<select id="courseFilterMajor" aria-label="筛选专业"></select></label>
  <label>专业方向<select id="courseFilterDirection" aria-label="筛选专业方向"></select></label>
  <button class="btn" id="courseFilterReset" type="button">重置筛选</button>
  <span id="courseFilterCount" class="muted" aria-live="polite"></span>
 </div>
 <table class="table"><thead><tr><th>课程</th><th>负责人</th><th>知识点</th><th>图谱状态</th><th>操作</th></tr></thead>
 <tbody id="courseBody"></tbody></table></div>
</section>

<section id="editor" class="page">
 <div class="toolbar"><button class="btn primary" onclick="addNode()">＋ 添加知识点</button><button class="btn" onclick="addRelation()">＋ 建立关系</button><button class="btn" onclick="alert('演示：系统已从教学大纲中抽取 12 个候选知识点')">AI 从大纲抽取</button><button class="btn" onclick="alert('图谱已保存')">保存图谱</button></div>
 <div class="card cti-section" id="courseRelationForm" hidden><div class="cti-top"><div><h3>建立知识节点关系</h3><p class="cti-sub">选择起点和终点，确认后请保存图谱。</p></div></div><div class="cti-actions"><label>起点 <select id="courseRelationFrom" aria-label="关系起点"></select></label><span>→</span><label>终点 <select id="courseRelationTo" aria-label="关系终点"></select></label><button type="button" class="btn primary" id="confirmCourseRelation">确认建立</button><button type="button" class="btn" id="cancelCourseRelation">取消</button></div></div>
 <div class="graph-layout">
  <div class="course-mind-card">
   <div class="course-mind-heading"><span class="course-mind-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-2.8-2-6-2-9-.7v13c3-1.3 6-1.3 9 .7m0-13c2.8-2 6-2 9-.7v13c-3-1.3-6-1.3-9 .7m0-13v13"/></svg></span><div><h3>本课程的章节与知识点</h3><p>按课程内容组织，展示本课程的知识结构。点击节点可在右侧编辑。</p></div></div>
   <div id="graph" class="graph" aria-label="课程知识图谱"></div>
   <div class="course-mind-footer"><span><i class="course-mind-dot blue"></i>课程</span><span><i class="course-mind-dot teal"></i>章节</span><span><i class="course-mind-dot outline"></i>知识点 / 能力</span><span class="course-mind-tip">画布可横向、纵向滚动</span></div>
  </div>
  <div class="card panel course-mind-panel"><h3>节点属性</h3><div id="emptyHint" class="muted">点击左侧节点查看并编辑属性。</div>
   <div id="nodeForm" style="display:none">
    <label>名称</label><input id="nodeName">
    <label>类型</label><select id="nodeType"><option>课程</option><option>章节</option><option>知识点</option><option>能力</option></select>
    <label>重要程度</label><select><option>核心</option><option>重点</option><option>一般</option></select>
    <label>说明</label><textarea id="nodeDesc"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" onclick="saveNode()">应用节点修改</button><button class="btn danger" onclick="deleteNode()">删除节点</button></div><p class="cti-sub">应用节点修改后，请点击上方“保存图谱”保存整张图谱。</p>
   </div>
  </div>
 </div>
</section>

<section id="map" class="page"></section>

<section id="redundancy" class="page"></section>

<section id="gap" class="page"></section>

 </div>
</main>
</div>

<div id="modal" class="modal"><div class="modal-box"><h3>新建课程</h3>
 <div class="form-row"><input id="newCourse" placeholder="课程名称"></div>
 <div class="form-row"><input placeholder="课程代码，例如 CS204"></div>
 <div class="form-row"><select><option>计算机科学与技术</option><option>人工智能</option><option>软件工程</option></select></div>
 <div style="text-align:right"><button class="btn" onclick="closeModal()">取消</button> <button class="btn primary" onclick="createCourse()">创建课程</button></div>
</div></div>

<style>

.major-edge-label{display:none}
.program-graph-stage .major-edge{marker-end:url(#programArrow)}
.program-graph-stage .major-edge{marker-end:none}
 .program-layout{grid-template-columns:minmax(760px,1.55fr) minmax(350px,.72fr)}.program-layout .major-graph{min-height:650px}.program-graph-stage{min-width:1000px;min-height:650px;padding-top:52px}.program-graph-stage .major-course-node{width:188px;padding:16px 16px;border-radius:14px}.program-graph-stage .major-course-node b{font-size:14px}.program-graph-stage .major-course-node small{margin-top:6px}.program-graph-stage .major-edge{stroke:#9aaec7;stroke-width:1.05}.program-stage-label{position:absolute;top:22px;transform:translateX(-50%);z-index:4;min-width:106px;padding:6px 10px;border:1px solid #dce6f2;border-radius:999px;background:#f7faff;color:#537096;font-size:12px;font-weight:700;text-align:center;letter-spacing:.04em}.program-stage-label:after{content:'';position:absolute;top:31px;left:50%;height:580px;border-left:1px dashed #d8e4f0;z-index:-1}@media(max-width:1050px){.program-layout{grid-template-columns:1fr}.program-graph-stage{min-width:900px}}
.program-graph-stage{min-width:1240px}@media(max-width:1050px){.program-graph-stage{min-width:1100px}}
</style>

<script>
const titles={dashboard:'管理驾驶舱',courses:'课程管理',editor:'课程图谱编辑',map:'专业知识地图',redundancy:'冗余分析',gap:'缺口分析'};
document.querySelectorAll('.menu-item').forEach(el=>el.onclick=()=>showPage(el.dataset.page));
function showPage(id){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelector(`[data-page="${id}"]`).classList.add('active');
 document.getElementById('pageTitle').innerText=titles[id];
}
function goEditor(){showPage('editor')}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function createCourse(){
 let n=document.getElementById('newCourse').value.trim()||'新建课程';
 document.getElementById('courseBody').insertAdjacentHTML('beforeend',`<tr><td>${n}</td><td>当前用户</td><td>0</td><td><span class="badge warn">建设中</span></td><td><button class="btn" onclick="goEditor()">开始建图</button></td></tr>`);
 closeModal();showPage('courses');
}

let nodes=[];let edges=[];let selected=null;
function renderGraph(){
 const g=document.getElementById('graph'),oldLeft=g.scrollLeft,oldTop=g.scrollTop;
 g.replaceChildren();
 if(!nodes.length){const empty=document.createElement('div');empty.className='cti-empty';empty.textContent='暂无节点，请添加知识点开始编辑。';g.appendChild(empty);return}
 // Layout only affects presentation; saved node positions and relations stay untouched.
 const byId=new Map(nodes.map(n=>[String(n.id),n])),children=new Map(nodes.map(n=>[String(n.id),[]])),incoming=new Map(nodes.map(n=>[String(n.id),0]));
 edges.forEach(e=>{const a=String(e[0]),b=String(e[1]);if(!byId.has(a)||!byId.has(b))return;children.get(a).push(b);incoming.set(b,incoming.get(b)+1)});
 const depth=new Map(),branch=new Map(),queue=[];let branchCount=0;
 function seed(n){const id=String(n.id);if(depth.has(id))return;depth.set(id,n.type==='课程'?0:n.type==='章节'?1:n.type==='能力'?3:2);branch.set(id,branchCount++);queue.push(id)}
 function walk(){for(let i=0;i<queue.length;i++){const id=queue[i];children.get(id).forEach(child=>{if(depth.has(child))return;depth.set(child,depth.get(id)+1);branch.set(child,byId.get(child).type==='章节'?branchCount++:branch.get(id));queue.push(child)})}queue.length=0}
 nodes.filter(n=>n.type==='课程').forEach(seed);walk();
 nodes.filter(n=>incoming.get(String(n.id))===0).forEach(seed);walk();
 nodes.forEach(n=>{if(!depth.has(String(n.id))){seed(n);walk()}});
 const columns=new Map();nodes.forEach(n=>{const d=depth.get(String(n.id));if(!columns.has(d))columns.set(d,[]);columns.get(d).push(n)});
 const maxDepth=Math.max(...depth.values()),largest=Math.max(...Array.from(columns.values(),column=>column.length));
 const width=Math.max(760,50+maxDepth*265+220),height=Math.max(510,largest*145+70),positions=new Map();
 columns.forEach((column,d)=>{const start=(height-(column.length-1)*145-64)/2;column.forEach((n,i)=>positions.set(String(n.id),{x:40+d*265,y:start+i*145}))});
 const stage=document.createElement('div');stage.className='course-mind-stage';stage.style.width=width+'px';stage.style.height=height+'px';
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('class','course-mind-lines');svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('aria-hidden','true');
 const palette=['#3087ed','#20b9a6','#7a8cdb','#e0a25f'];
 edges.forEach(e=>{const a=positions.get(String(e[0])),b=positions.get(String(e[1]));if(!a||!b)return;const x1=a.x+180,y1=a.y+32,x2=b.x,y2=b.y+32,color=palette[(branch.get(String(e[1]))||0)%palette.length],path=document.createElementNS(ns,'path');
  const curve=x2>x1?`M ${x1} ${y1} C ${x1+Math.max(35,(x2-x1)*.5)} ${y1}, ${x2-Math.max(35,(x2-x1)*.5)} ${y2}, ${x2} ${y2}`:`M ${x1} ${y1} C ${x1+65} ${y1}, ${x2-65} ${y2}, ${x2} ${y2}`;
  path.setAttribute('d',curve);path.setAttribute('stroke',color);svg.appendChild(path);[ [x1,y1],[x2,y2] ].forEach(([x,y])=>{const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r','3.5');dot.setAttribute('fill',color);svg.appendChild(dot)})
 });stage.appendChild(svg);
 nodes.forEach(n=>{const id=String(n.id),pos=positions.get(id),isSelected=String(selected)===id,el=document.createElement('button');el.type='button';el.className='course-mind-node'+(n.type==='课程'?' root':n.type==='章节'?' chapter'+((branch.get(id)||0)%2?' alt':''):'')+(isSelected?' selected':'');el.style.left=pos.x+'px';el.style.top=pos.y+'px';el.setAttribute('aria-pressed',String(isSelected));el.title=n.name||'未命名节点';
  const icon=document.createElement('span');icon.className=n.type==='课程'||n.type==='章节'?'course-mind-node-icon':'course-mind-point';icon.setAttribute('aria-hidden','true');if(n.type==='课程')icon.textContent='▤';else if(n.type==='章节')icon.textContent='▧';
  const name=document.createElement('span');name.className='course-mind-node-name';name.textContent=n.name||'未命名节点';el.append(icon,name);el.onclick=()=>{selectNode(n.id);const active=g.querySelector('.course-mind-node.selected');if(active)active.focus({preventScroll:true})};stage.appendChild(el);
  if(isSelected&&n.desc){const description=document.createElement('div'),label=document.createElement('strong'),content=document.createElement('span');description.className='course-mind-description';description.style.left=pos.x+'px';description.style.top=(pos.y+71)+'px';label.textContent='节点说明';content.textContent=n.desc;description.append(label,content);stage.appendChild(description)}
 });g.appendChild(stage);g.scrollLeft=oldLeft;g.scrollTop=oldTop;
}
function selectNode(id){selected=id;let n=nodes.find(x=>x.id==id);document.getElementById('emptyHint').style.display='none';document.getElementById('nodeForm').style.display='block';nodeName.value=n.name;nodeType.value=n.type;nodeDesc.value=n.desc||'';renderGraph()}
function saveNode(){if(!selected)return;let n=nodes.find(x=>x.id==selected);n.name=nodeName.value;n.type=nodeType.value;n.desc=nodeDesc.value;renderGraph()}
function deleteNode(){if(!selected)return;nodes=nodes.filter(n=>n.id!=selected);edges=edges.filter(e=>!e.includes(selected));selected=null;nodeForm.style.display='none';emptyHint.style.display='block';renderGraph()}
function addNode(){let id=Math.max(...nodes.map(n=>n.id))+1;nodes.push({id,name:'新知识点',type:'知识点',x:25+Math.random()*50,y:45+Math.random()*35,desc:'点击右侧编辑'});renderGraph();selectNode(id)}
function addRelation(){if(nodes.length>1){edges.push([nodes[nodes.length-2].id,nodes[nodes.length-1].id]);renderGraph();alert('演示：已在最近两个节点间建立关系')}}
function renderMap(){}
window.onload=()=>{renderGraph();renderMap()}
window.onresize=renderGraph;
</script>

ajor-editor-canvas"><div class="major-graph-stage major-editor-stage" style="width:${stageWidth}px;height:${stageHeight}px">${semester?semesterGrid():''}<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="${esc(direction)}课程关系图"><defs><marker id="majorArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="1.15" markerHeight="1.15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8097b5"/></marker></defs>${relationLines}</svg>${graph.nodes.map(node=>{const course=byId.get(node.id);return course?`<button type="button" class="major-course-node ${course.id===selectedMajorCourseId?'selected':''}" data-major-course="${esc(course.id)}" style="left:${displayNodes.get(node.id).x}%;top:${displayNodes.get(node.id).y}%"><b>${esc(course.name)}</b><small>${esc(course.code||course.group||'课程')}</small>${semester?'':'<span class="major-link-handle out" title="拖到另一门课程建立关系" aria-label="从右侧连接课程"></span>'}</button>`:''}).join('')}</div></div><div class="major-editor-footer"><span>连接线表示已建立的前后修关系</span><span>画布可左右滚动</span></div></section><aside class="major-workspace-card major-inspector"><h3>编辑课程关系</h3><p>课程信息和已有关系</p><div class="major-inspector-tabs" role="tablist"><button type="button" role="tab" data-major-tab="course" aria-selected="${majorInspectorTab==='course'}">课程信息</button><button type="button" role="tab" data-major-tab="relations" aria-selected="${majorInspectorTab==='relations'}">课程关系</button></div>${majorInspectorTab==='course'?`<div class="major-course-info"><div><b>当前课程</b>${esc(active?.name||'请选择课程')}</div><div><b>所属方向</b>${esc(direction)}</div><div><b>课程代码</b>${esc(active?.code||'未填写')}</div><div><b>课程负责人</b>${esc(active?.teacher||'未填写')}</div><div><b>课程知识点</b>${active?knowledge(active).length:0} 个</div></div><div class="semester-picker"><label for="courseSemester">开课学期</label><select id="courseSemester"><option value="">未安排</option>${Array.from({length:SEMESTER_COUNT},(_,index)=>`<option value="${index+1}" ${validSemester(nodeById.get(active?.id)?.semester)===index+1?'selected':''}>第${index+1}学期</option>`).join('')}</select><small>也可以在学期视图中拖动课程到对应学期。</small></div><button class="btn" type="button" id="editSelectedCourseGraph" style="width:100%">编辑课程知识图谱</button>`:`<div class="major-panel"><label for="prerequisiteCourse">前置课程</label><select id="prerequisiteCourse">${optionsFor(from)}</select><label for="successorCourse">后续课程</label><select id="successorCourse">${optionsFor(to)}</select><div class="major-inspector-note">${selectedEdge?'正在编辑选中的课程关系。':'选择两门课程建立关系，也可以从画布中的圆点拖动连线。'}</div><button class="btn primary" id="addMajorRelation" type="button" style="width:100%" ${courses.length<2?'disabled':''}>${selectedEdge?'保存关系':'建立关系'}</button>${selectedEdge?'<div class="cti-actions" style="margin-top:8px"><button class="btn" id="clearMajorRelation" type="button">取消选择</button><button class="btn danger" id="deleteSelectedMajorRelation" type="button">删除关系</button></div>':''}<div class="major-relations"><h3>已建立关系 · ${graph.edges.length}</h3>${graph.edges.length?graph.edges.map((edge,index)=>`<button class="major-relation-choice" type="button" data-major-edge="${index}" aria-pressed="${index===majorSelectedEdge}"><span>${esc(byId.get(edge[0])?.name||'未知课程')} → ${esc(byId.get(edge[1])?.name||'未知课程')}</span><span>›</span></button>`).join(''):'<p class="cti-sub">尚未建立关系。</p>'}</div></div>`}<div class="major-status"><b>关系检查</b><div>${duplicate?'⚠ 存在重复关系':'✓ 无重复关系'}</div><div>${cyclic?'⚠ 存在循环关系，请检查':'✓ 无循环关系'}</div><div>● 变更保存在本浏览器</div></div></aside></div>`:`<div class="major-workspace-empty"><b>${esc(direction||'专业方向')}</b><br>该方向尚未录入课程。请在课程管理中添加课程并选择此专业方向。</div>`}`;
